<div class="${C}"><input id="upi" class="${I}" placeholder="UPI ID (name@bank)" autocapitalize="off"><input id="am" class="${I}" type="number" step="0.01" min="0" placeholder="Amount"><button class="${B}" onclick="withdraw()">Request Withdrawal</button></div><h2 class="font-semibold mt-6 mb-2">Recent Requests</h2>${D.wds.length?'':empty('💸','No withdrawal requests yet.')}
<div class="space-y-2">${D.wds.map(w=>`<div class="bg-white rounded-xl p-3 flex justify-between items-center shadow-sm"><div class="min-w-0"><div class="font-semibold">${m(w.amount)}</div><div class="text-xs text-slate-400 truncate">${e(w.upi)} · ${dt(w.created_at)}</div></div>${pill(w.status)}</div>`).join('')}</div>`,
refer:u=>{const got=id=>D.rtx.filter(t=>t.ref_id===id).reduce((a,t)=>a+ +t.amount,0),tot=D.rtx.reduce((a,t)=>a+ +t.amount,0);return `<h1 class="text-xl font-bold">Refer &amp; Earn</h1><p class="text-slate-500 text-sm mb-4">Earn ${m(D.set.referral_reward)} for every friend who joins with your code.</p>
<div class="rounded-3xl bg-indigo-600 text-white p-6 text-center shadow-lg mb-4"><div class="text-indigo-100 text-sm">Your Referral Code</div><div class="sel text-4xl font-extrabold tracking-widest my-2">${e(RC(u))}</div><div class="flex gap-2 justify-center"><button onclick="cp('${e(RC(u))}')" class="bg-white text-indigo-600 font-semibold rounded-full px-6 py-2">Copy Code</button><button onclick="share()" class="bg-indigo-800 text-white font-semibold rounded-full px-6 py-2">Share</button></div></div>
<div class="${C} mb-4"><div class="text-xs text-slate-400 mb-1">Referral Link</div><div class="sel text-sm truncate bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 mb-3">${e(link())}</div><button onclick="cp(link())" class="w-full bg-indigo-600 text-white font-semibold rounded-full px-6 py-2.5 shadow-md shadow-indigo-200 active:scale-95 transition">Copy Link</button></div>
<div class="grid grid-cols-2 gap-3 mb-4"><div class="${C} text-center"><div class="text-2xl font-bold">${D.refs.length}</div><div class="text-xs text-slate-400">Total Referrals</div></div><div class="${C} text-center"><div class="text-2xl font-bold">${m(tot)}</div><div class="text-xs text-slate-400">Total Earned</div></div></div>
<h2 class="font-semibold mb-2">Your Referrals</h2>${D.refs.length?'':empty('🎁','No referrals yet. Share your code!')}<div class="space-y-2">${D.refs.map(x=>`<div class="bg-white rounded-xl p-3 flex justify-between shadow-sm"><div><div class="font-medium">${e(x.name)}</div><div class="text-xs text-slate-400">Joined ${dt(x.created_at)}</div></div><div class="text-green-600 font-bold">+${m(got(x.id))}</div></div>`).join('')}</div>`},
profile:u=>`<div class="text-center my-4"><div class="w-20 h-20 mx-auto rounded-full bg-indigo-600 text-white grid place-items-center text-3xl font-bold">${e(u.name[0].toUpperCase())}</div><h1 class="text-xl font-bold mt-3">${e(u.name)}</h1></div><div class="${C} space-y-3 mb-4"><div><div class="text-xs text-slate-400">Username</div><div class="font-medium">${e(u.mobile)}</div></div><div><div class="text-xs text-slate-400">Referral Code</div><div class="font-medium">${e(RC(u))}</div></div></div>
<div class="${C} mb-4"><label class="font-semibold block mb-2">Edit Name</label><input id="nm" class="${I}" value="${e(u.name)}" maxlength="80"><button class="${B}" onclick="saveName()">Save</button></div><button onclick="logout()" class="w-full bg-red-50 text-red-600 font-semibold rounded-xl py-3.5">Logout</button><p onclick="checkUpdate(1)" class="text-center text-xs text-slate-400 mt-4">App version ${APP_VER_NAME} · Tap to check update</p>`,
adash:()=>{const s=D.st,n=(a,b)=>`<div class="${C}"><div class="text-xs text-slate-400">${a}</div><div class="text-xl font-bold">${b}</div></div>`;return `<h1 class="text-xl font-bold mb-3">Dashboard</h1><div class="grid grid-cols-2 gap-3 mb-5">${n('Total Users',s.users)}${n('Active Users',s.active)}${n('Total Tasks',s.tasks)}${n('Completed Tasks',s.done)}${n('Pending Submissions',s.ps)}${n('Pending Withdrawals',s.pw)}${n('Total Payout',m(s.paid))}${n('Total Earnings',m(s.earn))}</div>
<div class="grid grid-cols-2 gap-3 text-center text-sm font-semibold"><button onclick="go('atasks')" class="bg-indigo-600 text-white rounded-xl py-3">+ Add Task</button><button onclick="go('asubs')" class="bg-white rounded-xl py-3">Review Submissions</button><button onclick="go('awd')" class="bg-white rounded-xl py-3">Review Withdrawals</button><button onclick="go('ausers')" class="bg-white rounded-xl py-3">Manage Users</button></div>`},
atasks:()=>{const x=A?D.tasks.find(t=>t.id===A):null,f=(i,p,val)=>`<input id="${i}" class="${I2}" placeholder="${p}" value="${e(val??'')}">`;return `<h1 class="text-xl font-bold mb-3">${x?'Edit Task':'Add Task'}</h1><div class="${C} grid gap-3 mb-6">${f('tt','Title',x&&x.title)}<select id="ty" class="${I2}">${Object.entries(T).map(([k,l])=>`<option value="${k}" ${x&&x.type===k?'selected':''}>${l[0]}</option>`).join('')}</select><div><label class="text-sm font-semibold block mb-1">Task Logo (optional)</label><div class="flex items-center gap-3"><div id="lp" class="w-14 h-14 rounded-xl bg-indigo-50 grid place-items-center overflow-hidden shrink-0 text-2xl">${LOGO?`<img src="${LOGO}" class="w-full h-full object-cover">`:'🖼️'}</div><div class="flex-1 min-w-0"><input id="tl" type="file" accept="image/*" onchange="pickLogo(this)" class="block w-full text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-indigo-50 file:px-3 file:py-2 file:font-semibold file:text-indigo-700"><button type="button" onclick="clrLogo()" class="text-xs text-red-600 mt-1">Remove logo</button></div></div></div>
<textarea id="td" rows="3" class="${I2}" placeholder="Description">${e(x?x.descr:'')}</textarea>${f('tr','Reward Amount',x&&x.reward)}${f('tm','Max completions (blank = unlimited)',x&&x.max_count||'')}${f('tu','Task URL (https://…)',x&&x.url)}
<label class="flex items-center gap-2"><input id="tp" type="checkbox" ${x&&x.proof?'checked':''}> Proof required</label><div class="flex gap-2"><button class="bg-indigo-600 text-white font-semibold rounded-xl px-6 py-2.5" onclick="aTask(${x?x.id:0})">${x?'Update':'Add Task'}</button>${x?`<button class="px-6 py-2.5 rounded-xl border" onclick="go('atasks')">Cancel</button>`:''}</div></div>
<h2 class="font-semibold mb-2">All Tasks (${D.tasks.length})</h2><div class="space-y-3">${D.tasks.map(t=>`<div class="${C}"><div class="flex justify-between gap-2"><div class="flex gap-3 items-center min-w-0"><div class="w-10 h-10 rounded-lg bg-indigo-50 grid place-items-center overflow-hidden shrink-0">${tic(t)}</div><div class="min-w-0"><div class="font-semibold truncate">${e(t.title)}</div><div class="text-xs text-slate-400">${T[t.type][0]} · ${m(t.reward)}${t.proof?' · Proof':''} · Max ${t.max_count||'∞'}</div></div></div>${pill(t.active?'active':'inactive')}</div><div class="flex gap-2 mt-3 text-sm"><button onclick="go('atasks',${t.id})" class="px-4 py-2 rounded-lg bg-indigo-50 text-indigo-700">Edit</button><button onclick="aTog(${t.id},${t.active})" class="px-4 py-2 rounded-lg bg-slate-100">${t.active?'Deactivate':'Activate'}</button><button onclick="aDel(${t.id})" class="px-4 py-2 rounded-lg bg-red-50 text-red-600">Delete</button></div></div>`).join('')}</div>`},
asubs:()=>`<h1 class="text-xl font-bold mb-3">Submissions</h1>${D.subs.length?'':empty('🖼️','No submissions yet.')}<div class="space-y-3">${D.subs.map(s=>{const t=s.tasks||{title:'(deleted)',reward:0,type:'watch'};return `<div class="${C}"><div class="flex justify-between"><div class="font-semibold">${e((s.profiles||{}).name)}</div>${pill(s.status)}</div><div class="text-sm mt-2">${e(t.title)} · <b>${m(rw(t))}</b></div><div class="text-xs text-slate-400 mb-2">${dt(s.created_at)}</div>${s.proof&&/^data:image\//.test(s.proof)?`<img src="${s.proof}" class="rounded-xl max-h-64 w-full object-contain bg-slate-50">`:''}${s.status==='pending'?`<div class="flex gap-2 mt-3"><button onclick="aSub(${s.id},true)" class="flex-1 rounded-xl py-2.5 font-semibold bg-green-600 text-white">Approve</button><button onclick="aSub(${s.id},false)" class="flex-1 rounded-xl py-2.5 font-semibold bg-red-50 text-red-600">Reject</button></div>`:''}</div>`}).join('')}</div>`,
awd:()=>{const bt={pending:[['approve','Approve','bg-blue-600 text-white'],['reject','Reject','bg-red-50 text-red-600']],approved:[['paid','Mark Paid','bg-green-600 text-white']]};return `<h1 class="text-xl font-bold mb-3">Withdrawals</h1><div class="flex gap-2 mb-4 overflow-x-auto no-sb">${['pending','approved','paid','rejected'].map(t=>`<button onclick="WS='${t}';go('awd')" class="rounded-full px-4 py-2 text-sm font-medium ${WS===t?'bg-indigo-600 text-white':'bg-white'}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${D.wds.length?'':empty('💸','No '+WS+' withdrawals.')}
<div class="space-y-3">${D.wds.map(w=>`<div class="${C}"><div class="flex justify-between"><div class="font-semibold">${e((w.profiles||{}).name)}</div><div class="font-bold text-lg">${m(w.amount)}</div></div><div class="sel text-sm mt-2">UPI: <b>${e(w.upi)}</b></div><div class="text-xs text-slate-400">${dt(w.created_at)} · ${w.status}</div>${bt[w.status]?`<div class="flex gap-2 mt-3">${bt[w.status].map(b=>`<button onclick="aWd(${w.id},'${b[0]}')" class="flex-1 rounded-xl py-2.5 font-semibold ${b[2]}">${b[1]}</button>`).join('')}</div>`:''}</div>`).join('')}</div>`},
ausers:()=>`<h1 class="text-xl font-bold mb-3">Users</h1><div class="flex gap-2 mb-4"><input id="q" value="${e(Q)}" placeholder="Search name or mobile" class="flex-1 rounded-xl border px-4 py-2.5"><button onclick="Q=v('q');go('ausers')" class="bg-indigo-600 text-white rounded-xl px-5">Search</button></div>${D.users.length?'':empty('👥','No users found.')}<div class="space-y-3">${D.users.map(u=>`<div class="${C}"><div class="flex justify-between"><div><div class="font-semibold">${e(u.name)}</div><div class="text-xs text-slate-400">${e(u.mobile)} · ${e(RC(u))}</div></div>${pill(u.status)}</div><div class="text-sm mt-2">Wallet: <b>${m(u.balance)}</b> · Joined ${dt(u.created_at)}</div><button onclick="aBlock('${u.id}','${u.status}')" class="mt-3 rounded-xl px-5 py-2 font-semibold ${u.status==='blocked'?'bg-green-600 text-white':'bg-red-50 text-red-600'}">${u.status==='blocked'?'Unblock':'Block'}</button></div>`).join('')}</div>`,
aset:()=>{const f=[['s1','Minimum Withdrawal','min_withdraw'],['s2','Referral Reward','referral_reward'],['s3','Welcome Bonus','welcome_bonus'],['s4','Daily Check-in Reward','daily_reward']];return `<h1 class="text-xl font-bold mb-3">Settings</h1><div class="${C} grid gap-3">${f.map(x=>`<label class="text-sm text-slate-500">${x[1]}<input id="${x[0]}" type="number" step="0.01" min="0" value="${D.set[x[2]]??0}" class="${I2} text-slate-800"></label>`).join('')}<button class="${B}" onclick="aSet()">Save Settings</button></div>`}};
const IC=(()=>{const s=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 mx-auto">${p}</svg>`;return{
home:s('<path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>'),
wallet:s('<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.3"/>'),
refer:s('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>'),
profile:s('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>')}})();
function render(){const pub=['login','signup'],adm=false;
if(!D.me){if(!pub.includes(P))P=REFURL?'signup':'login';$('app').innerHTML=V[P]();return}
if(pub.includes(P))P='home';if(adm&&!D.adm)P='home';
const sT=`style="padding-top:max(env(safe-area-inset-top,0px),${TOP_GAP}px)"`,sBt='style="padding-bottom:env(safe-area-inset-bottom,0px)"',u=D.me,isA=false;
const N=[['home','🏠','Home'],['wallet','👛','Wallet'],['refer','🎁','Refer'],['profile','👤','Profile']];
const act={home:'home',task:'home',wallet:'wallet',withdraw:'wallet',refer:'refer',profile:'profile'}[P];
$('app').innerHTML=`<div class="sticky top-0 z-30 bg-white border-b" ${sT}><div class="h-14 px-4 flex items-center justify-between"><a onclick="go('${isA?'adash':'home'}')" class="flex items-center gap-2 font-bold text-lg"><span class="w-8 h-8 rounded-xl bg-indigo-600 text-white grid place-items-center text-sm">₹</span><span style="color:#2563eb;font-size:22px;font-weight:800">EarnX</span>${isA?' <span class="text-indigo-600">Admin</span>':''}</a></div></div>
<main class="p-4 ${isA?'pb-16':'pb-28'}">${LD?'<div class="py-24 text-center text-slate-400"><div class="w-8 h-8 mx-auto mb-3 rounded-full border-4 border-indigo-200 border-t-indigo-600 animate-spin"></div>Loading…</div>':V[P](u)}</main>
${isA?'':`<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t z-30 grid grid-cols-4" ${sBt}>${N.map(n=>`<a onclick="go('${n[0]}')" class="py-2 text-center text-xs font-medium ${act===n[0]?'text-indigo-600':'text-slate-400'}">${IC[n[0]]}<div class="mt-0.5">${n[2]}</div></a>`).join('')}</nav>`}`}
checkUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});setInterval(checkUpdate,600000);
(async()=>{try{await me()}catch(x){}if(D.me)await go('home');else render()})();
</script></body></html>
